---
name: "qa"

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    release:
        runs-on: "ubuntu-latest"

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - run: npm ci
            - run: npm test
            - run: npm run update
            - run: npm run build
